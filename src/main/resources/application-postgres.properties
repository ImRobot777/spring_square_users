# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/square_users
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema initialization
#spring.sql.init.mode=always #No need, user_entity table will only be dynamically generated by hibernate not JDBC (so there is no schema.sql neither)

# JPA / Hibernate for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
